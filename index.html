<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Concert Lyrics Practice</title>
<style>
  :root{--bg:#0b0b0f;--card:#16161d;--card2:#1f1f2a;--text:#e2e2ea;--muted:#8a8a9a;--accent:#a78bfa;--accent2:#f472b6;--line:#2a2a36}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);min-height:100vh;-webkit-text-size-adjust:100%}

  /* 레이아웃: 모바일은 세로 배치, 넓은 화면은 왼쪽 CD / 오른쪽 가사 */
  .layout{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1fr;gap:0}

  /* CD */
  .cd-area{padding:20px 16px 8px;text-align:center}
  .cd-btn{display:block;margin:0 auto;width:min(88vw,52vh);background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;border-radius:50%}
  @supports (height:1dvh){.cd-btn{width:min(88vw,52dvh)}}
  .disc{position:relative;width:100%;aspect-ratio:1;border-radius:50%;overflow:hidden;
    box-shadow:0 0 0 6px #1a1a22,0 12px 40px rgba(167,139,250,.28);
    animation:spin 8s linear infinite;animation-play-state:paused}
  .disc.playing{animation-play-state:running}
  .disc img{width:100%;height:100%;object-fit:cover;display:block;-webkit-user-drag:none;user-select:none}
  .disc::before{content:"";position:absolute;inset:0;border-radius:50%;
    background:conic-gradient(from 0deg,rgba(255,255,255,.14),transparent 20%,rgba(255,255,255,.1) 45%,transparent 65%,rgba(255,255,255,.14))}
  .disc::after{content:"";position:absolute;left:50%;top:50%;width:17%;height:17%;transform:translate(-50%,-50%);border-radius:50%;
    background:var(--bg);box-shadow:0 0 0 5px rgba(255,255,255,.35),0 0 0 9px rgba(0,0,0,.35)}
  @keyframes spin{to{transform:rotate(360deg)}}
  .hint{margin-top:12px;font-size:13px;color:var(--muted)}

  /* 챕터: 옆으로 슬라이드하는 곡 제목 띠 (가운데에 멈춤) */
  .chapters{position:sticky;top:env(safe-area-inset-top);z-index:10;background:var(--bg);
    display:flex;gap:30px;overflow-x:auto;padding:12px 50%;
    scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent);
    mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent)}
  .chapters::-webkit-scrollbar{display:none}
  .chapter{flex:0 0 auto;scroll-snap-align:center;position:relative;min-height:44px;padding:6px 2px;
    background:none;border:0;color:#6b6b7c;font-size:17px;font-weight:400;cursor:pointer;white-space:nowrap;
    transition:color .2s,font-size .2s;-webkit-tap-highlight-color:transparent}
  .chapter.active{color:#fff;font-weight:800;font-size:19px}
  .chapter.active::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--accent2))}

  /* 가사 (한 번에 하나만 표시) */
  .lyrics{padding:16px 12px calc(40px + env(safe-area-inset-bottom))}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
  .card-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .card-label{flex:1;font-size:12px;letter-spacing:.08em;color:var(--accent);font-weight:700}
  .nav{min-width:44px;min-height:40px;border-radius:20px;background:var(--card2);color:var(--text);border:1px solid var(--line);font-size:14px;cursor:pointer}
  .count{font-size:12px;color:var(--muted);min-width:36px;text-align:center}
  .card-body{white-space:pre-wrap;word-break:break-word;font-size:20px;line-height:1.75;color:#b4b4c2}
  .card-body.empty{color:var(--muted);font-style:italic;font-size:16px}
  /* [[ ]]로 감싼 따라 부를 부분은 굵게 */
  .hl{color:#fff;font-weight:800}

  /* 곡별 재생바 */
  .bar{display:flex;align-items:center;gap:10px;width:min(88vw,52vh);margin:16px auto 0;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .bar span{min-width:36px}.bar span:last-child{text-align:right}
  #seek{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:28px;background:none;margin:0}
  #seek::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--accent2) var(--p,0%),var(--card2) var(--p,0%))}
  #seek::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-7px;border-radius:50%;background:#fff}
  #seek::-moz-range-track{height:6px;border-radius:3px;background:var(--card2)}
  #seek::-moz-range-progress{height:6px;border-radius:3px;background:var(--accent2)}
  #seek::-moz-range-thumb{width:20px;height:20px;border:0;border-radius:50%;background:#fff}

  @media (min-width:900px){
    .layout{grid-template-columns:minmax(360px,44%) 1fr;grid-template-areas:"cd lyrics" "chap lyrics";grid-template-rows:auto 1fr;gap:0 24px;padding:16px}
    .cd-area{grid-area:cd}.chapters{grid-area:chap;position:static}
    .lyrics{grid-area:lyrics;padding:20px 0}
    .cd-btn{width:min(100%,64vh)}
    .card-body{font-size:22px}
  }
@media (min-width:900px){.bar{width:min(100%,64vh)}}
</style>
</head>

function parseSongs(raw){
  const out = [];
  let cur = null, chunk = null, prevBlank = true;
  const flush = () => { if(chunk && cur){ chunk.text = chunk.text.replace(/\s+$/, ""); cur.lyrics.push(chunk); } chunk = null; };
  String(raw || "").replace(/\r/g, "").split("\n").forEach(line => {
    const t = line.trim();
    const at = t.match(/^@\s*(\d{1,2}(?::\d{2}){0,2})$/);
    const head = !at && prevBlank && t.match(/^(.*?)[\s:]+(\d{1,2}(?::\d{2}){1,2})\s*$/);
    if(head && head[1].trim()){
      flush(); cur = { title: head[1].trim(), start: head[2], lyrics: [] }; out.push(cur);
    }else if(at && cur){
      flush(); chunk = { start: at[1], text: "" };
    }else if(chunk){
      chunk.text += line + "\n";
    }
    prevBlank = t === "";
  });
  flush();
  return out;
}

function parseTime(v){
  try{
    if(typeof v === "number") return isFinite(v) && v >= 0 ? v : 0;
    const s = String(v ?? "").trim();
    if(/^\d+(\.\d+)?$/.test(s)) return parseFloat(s);
    const p = s.split(":").map(n => parseInt(n, 10));
    if(p.length < 2 || p.length > 3 || p.some(n => isNaN(n) || n < 0)) return 0;
    return p.reduce((a, n) => a * 60 + n, 0);
  }catch(e){ return 0; }
}

  const re = /\[\[([\s\S]*?)(?:\]\]|$)/g;
  const plain = x => { x = x.replace(/\]\]/g, ""); if(x) el.appendChild(document.createTextNode(x)); };
  while((m = re.exec(text)) !== null){
    plain(text.slice(last, m.index));
    if(m[1]){ const sp = document.createElement("span"); sp.className = "hl"; sp.textContent = m[1]; el.appendChild(sp); }
    last = re.lastIndex;
    if(m[0] === "") re.lastIndex++;
  }
  plain(text.slice(last));
}
function showLyric(i){
  const s = data[curSong]; if(!s) return;
  curLyric = Math.max(0, Math.min(i, s.items.length - 1));
  renderText($("body"), s.items[curLyric].text);
  $("count").textContent = (curLyric + 1) + " / " + s.items.length;
  $("prev").disabled = curLyric === 0; $("next").disabled = curLyric === s.items.length - 1;
  $("prev").style.opacity = $("prev").disabled ? .35 : 1; $("next").style.opacity = $("next").disabled ? .35 : 1;
}
function setSong(i){
  curSong = i; curLyric = -1;
  [...$("chapters").children].forEach((b, n) => b.classList.toggle("active", n === i));
  const b = $("chapters").children[i];
  if(b && b.scrollIntoView) try{ b.scrollIntoView({inline:"center", block:"nearest", behavior:"smooth"}); }catch(e){}
}
// 영상 시간 t에 맞춰 챕터/가사 갱신
function syncAt(t){
  if(!data.length) return;
  let si = 0;
  data.forEach((s, n) => { if(s.start <= t + TOL) si = n; });
  if(si !== curSong){ setSong(si); showLyric(0); }
  const items = data[si].items;
  if(items.some(it => it.start !== null)){
    let li = 0;
    items.forEach((it, n) => { if(it.start !== null && it.start <= t + TOL) li = n; });
    if(li !== curLyric) showLyric(li);
  }
}
function seekAndPlay(sec){
  try{ audio.currentTime = sec; audio.play().catch(() => {}); }catch(e){ console.warn(e); }
  tick();
}
const fmt = sec => { sec = Math.max(0, Math.floor(sec || 0)); return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0"); };
// 현재 곡의 [시작, 끝] (끝 = 다음 곡 시작, 마지막 곡은 음원 끝)
function songRange(i){
  const st = data[i].start;
  const en = i + 1 < data.length ? data[i + 1].start : (isFinite(audio.duration) ? audio.duration : st);
  return [st, Math.max(en, st)];
}
function updateBar(t){
  if(curSong < 0) return;
  const [st, en] = songRange(curSong), len = en - st, p = Math.min(Math.max(t - st, 0), len);
  $("seek").max = len; $("tTot").textContent = fmt(len);
  if(!dragging){ $("seek").value = p; $("tCur").textContent = fmt(p); }
  $("seek").style.setProperty("--p", (len ? 100 * p / len : 0) + "%");
}
function tick(){ const t = audio.currentTime || 0; syncAt(t); updateBar(t); }

function build(){
  if(!data.length){ $("lyrics").innerHTML = '<div class="card"><div class="card-body empty">곡 데이터가 없습니다.</div></div>'; return; }
  data.forEach((s, i) => {
    const b = document.createElement("button");
    b.className = "chapter"; b.type = "button"; b.textContent = (i + 1) + ". " + s.title;
    b.addEventListener("click", () => { seekAndPlay(s.start); syncAt(s.start); });
    $("chapters").appendChild(b);
  });
  $("lyrics").innerHTML = '<article class="card"><div class="card-head"><span class="card-label">가사</span>' +
    '<button class="nav" id="prev" type="button">◀</button><span class="count" id="count"></span>' +
    '<button class="nav" id="next" type="button">▶</button></div><div class="card-body" id="body"></div></article>';
  const step = d => {
    const it = data[curSong].items[curLyric + d]; if(!it) return;
    if(it.start !== null && ready) seekAndPlay(it.start); else showLyric(curLyric + d);
    if(it.start !== null) showLyric(curLyric + d);
  };
  $("prev").addEventListener("click", () => step(-1));
  $("next").addEventListener("click", () => step(1));
  syncAt(0);
}

// CD 누르면 재생/일시정지
$("cdBtn").addEventListener("click", () => { audio.paused ? audio.play().catch(() => {}) : audio.pause(); });
// 곡별 재생바
$("seek").addEventListener("input", e => { dragging = true; $("tCur").textContent = fmt(+e.target.value); });
$("seek").addEventListener("change", e => { audio.currentTime = songRange(curSong)[0] + (+e.target.value); dragging = false; tick(); });
audio.addEventListener("timeupdate", tick);
audio.addEventListener("loadedmetadata", tick);
audio.addEventListener("play", () => $("disc").classList.add("playing"));
["pause", "ended"].forEach(ev => audio.addEventListener(ev, () => $("disc").classList.remove("playing")));
audio.addEventListener("error", () => { $("hint").textContent = "음원 파일을 찾을 수 없습니다. mp3가 이 HTML과 같은 폴더에 있는지, 파일 이름이 맞는지 확인하세요."; });

// 마우스 휠로도 옆으로 넘기기
$("chapters").addEventListener("wheel", e => { if(Math.abs(e.deltaY) > Math.abs(e.deltaX)){ e.preventDefault(); $("chapters").scrollLeft += e.deltaY; } }, { passive: false });

build();
audio.src = AUDIO_SRC;
